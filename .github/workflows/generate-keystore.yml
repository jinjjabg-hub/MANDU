name: Generate upload keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and encrypt keystore
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KP" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          umask 077
          keytool -genkeypair -keystore android.keystore -storetype PKCS12 -alias mandu -keyalg RSA -keysize 2048 -validity 10000 -storepass:env KP -keypass:env KP -dname "CN=SONG SEUNGHUN, O=T.M LINK, L=Busan, ST=Busan, C=KR"
          keytool -list -v -keystore android.keystore -storepass:env KP -alias mandu | grep -E 'Alias name|Owner:|SHA256:'
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -in android.keystore -out android.keystore.enc -pass env:KP
          rm -f android.keystore

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: mandu-keystore-encrypted
          path: android.keystore.enc
          retention-days: 1

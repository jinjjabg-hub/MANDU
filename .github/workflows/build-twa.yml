name: Build TWA APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '앱 버전 (예: 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: '버전 코드 (정수, 업로드마다 증가)'
        required: false
        default: '1'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore
          echo "Keystore restored."

      - name: Patch twa-manifest with version and keystore password
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
          # 태그 빌드면 태그에서 버전 추출
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${{ github.ref_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          fi
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa/twa-manifest.json','utf8'));
            m.appVersionName = process.env.VERSION_NAME;
            m.appVersionCode = parseInt(process.env.VERSION_CODE, 10);
            m.signingKey.password = process.env.KEYSTORE_PASSWORD;
            m.signingKey.keypassword = process.env.KEYSTORE_PASSWORD;
            fs.writeFileSync('twa/twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Manifest patched:', m.appVersionName, '#' + m.appVersionCode);
          "
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Bubblewrap build
        working-directory: twa
        run: bubblewrap build --skipPwaValidation

      - name: Rename artifacts
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          cp twa/app-release-signed.apk mandu-v${VERSION}.apk 2>/dev/null || true
          cp twa/app-release-bundle.aab  mandu-v${VERSION}.aab  2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandu-apk-${{ github.event.inputs.version_name || github.ref_name }}
          path: |
            mandu-*.apk
            mandu-*.aab
          if-no-files-found: warn

      - name: Create GitHub Release (태그 빌드 시)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mandu-*.apk
            mandu-*.aab
          generate_release_notes: true

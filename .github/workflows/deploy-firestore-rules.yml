name: Deploy Firestore rules

# main 에 firestore.rules 가 바뀌어 합쳐지면: 규칙 테스트 → 통과하면 Firebase 에 자동 배포.
# 필요한 GitHub 비밀값: FIREBASE_SERVICE_ACCOUNT (Firebase 서비스 계정 키 JSON 전체)
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules.test.mjs'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 규칙 테스트 (에뮬레이터)
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase 에 규칙 배포
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어 배포하지 못했습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi
          KEY="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$KEY"
          export GOOGLE_APPLICATION_CREDENTIALS="$KEY"
          echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          npx --yes firebase-tools@13 deploy --only firestore:rules --project mandutok --non-interactive
          rm -f "$KEY"

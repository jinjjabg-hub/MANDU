<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANDU</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--accent:#ff6b35;--accent2:#ffd166;--text:#f0f0f0;--dim:#7a7a8c;--border:#2a2a3a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#loading{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce 0.8s ease infinite;}
.dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-8px);opacity:1;}}
#login-screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px;background:radial-gradient(ellipse at 50% 30%,#1a1a2e,var(--bg));}
.logo-emoji{font-size:72px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.logo-title{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;letter-spacing:6px;color:var(--accent);}
.logo-sub{font-size:12px;color:var(--dim);letter-spacing:3px;}
.tagline{text-align:center;color:var(--dim);font-size:14px;line-height:1.8;}
.tagline strong{color:var(--accent2);}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#333;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.25);transition:all .2s;}
.google-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,53,.4);}
.google-btn img{width:20px;height:20px;}
#chat-screen{flex:1;display:none;flex-direction:column;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.header-logo{font-family:'Space Mono',monospace;font-size:18px;color:var(--accent);letter-spacing:2px;}
.room-tag{font-size:12px;color:var(--dim);background:var(--surface2);padding:3px 10px;border-radius:20px;margin-left:8px;}
.header-right{display:flex;align-items:center;gap:10px;}
.user-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);}
.logout-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.logout-btn:hover{border-color:var(--accent);color:var(--accent);}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
#messages::-webkit-scrollbar{width:4px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg-wrap{display:flex;flex-direction:column;max-width:75%;animation:msgIn .2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg-wrap.mine{align-self:flex-end;align-items:flex-end;}
.msg-wrap.theirs{align-self:flex-start;align-items:flex-start;}
.msg-sender{font-size:11px;color:var(--dim);margin-bottom:3px;padding:0 4px;}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;}
.mine .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.theirs .msg-bubble{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:10px;color:var(--dim);margin-top:3px;padding:0 4px;}
.chat-input-wrap{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;}
#msg-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.5;transition:border-color .2s;}
#msg-input:focus{border-color:var(--accent);}
#msg-input::placeholder{color:var(--dim);}
.send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:12px;cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.send-btn:hover{background:#ff8555;}
</style>
</head>
<body>
<div id="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<div id="login-screen">
  <div class="logo-emoji">🥟</div>
  <div class="logo-title">MANDU</div>
  <div class="logo-sub">TRANSLATION MESSENGER</div>
  <div class="tagline"><p>언어가 달라도 <strong>대화는 하나로</strong></p><p>Google 계정으로 바로 시작하세요</p></div>
  <button class="google-btn" id="loginBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
    Google로 시작하기
  </button>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <div style="display:flex;align-items:center;">
      <span class="header-logo">🥟 MANDU</span>
      <span class="room-tag">글로벌 채팅</span>
    </div>
    <div class="header-right">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="chat-input-wrap">
    <textarea id="msg-input" placeholder="메시지를 입력하세요..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAZoWSGSA81daZydNgzegct2aaeFbDajr0",
  authDomain:"mandu-e7c3c.firebaseapp.com",
  projectId:"mandu-e7c3c",
  storageBucket:"mandu-e7c3c.firebasestorage.app",
  messagingSenderId:"196338490174",
  appId:"1:196338490174:web:78dc77e684945aca362a6f"
});
const auth=firebase.auth();
const db=firebase.firestore();
const provider=new firebase.auth.GoogleAuthProvider();
let currentUser=null,unsubscribe=null;

document.getElementById('loginBtn').onclick=()=>auth.signInWithRedirect(provider);
document.getElementById('logoutBtn').onclick=()=>{if(unsubscribe)unsubscribe();auth.signOut();};

auth.getRedirectResult().catch(e=>console.error(e));

auth.onAuthStateChanged(user=>{
  document.getElementById('loading').style.display='none';
  if(user){
    currentUser=user;
    document.getElementById('user-avatar').src=user.photoURL||'';
    document.getElementById('login-screen').style.display='none';
    document.getElementById('chat-screen').style.display='flex';
    loadMessages();
  }else{
    currentUser=null;
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('chat-screen').style.display='none';
  }
});

function loadMessages(){
  const c=document.getElementById('messages');
  unsubscribe=db.collection('messages').orderBy('createdAt','asc').limitToLast(50).onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{if(ch.type==='added')renderMsg(ch.doc.data());});
    c.scrollTop=c.scrollHeight;
  });
}
function renderMsg(d){
  const c=document.getElementById('messages');
  const mine=d.uid===currentUser.uid;
  const w=document.createElement('div');
  w.className='msg-wrap '+(mine?'mine':'theirs');
  if(!mine){const s=document.createElement('div');s.className='msg-sender';s.textContent=d.displayName||'익명';w.appendChild(s);}
  const b=document.createElement('div');b.className='msg-bubble';b.textContent=d.text;w.appendChild(b);
  const t=document.createElement('div');t.className='msg-time';
  t.textContent=d.createdAt?d.createdAt.toDate().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  w.appendChild(t);c.appendChild(w);
}
async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!currentUser)return;
  input.value='';input.style.height='auto';
  await db.collection('messages').add({text,uid:currentUser.uid,displayName:currentUser.displayName,photoURL:currentUser.photoURL,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
</script>
</body>
</html>

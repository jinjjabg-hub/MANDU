<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANDU 🥟</title>
<link href="./MANDU 🥟_files/css2" rel="stylesheet">

<!-- Firebase CDN -->
<script src="./MANDU 🥟_files/firebase-app-compat.js.다운로드"></script>
<script src="./MANDU 🥟_files/firebase-auth-compat.js.다운로드"></script>
<script src="./MANDU 🥟_files/firebase-firestore-compat.js.다운로드"></script>

<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --accent: #ff6b35;
    --accent2: #ffd166;
    --text: #f0f0f0;
    --text-dim: #7a7a8c;
    --my-bubble: #ff6b35;
    --other-bubble: #1c1c27;
    --border: #2a2a3a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 24px;
    background: radial-gradient(ellipse at 50% 30%, #1a1a2e 0%, #0a0a0f 70%);
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    animation: fadeUp 0.8s ease both;
  }

  .logo-emoji {
    font-size: 72px;
    filter: drop-shadow(0 0 24px rgba(255,107,53,0.4));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo-title {
    font-family: 'Space Mono', monospace;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(255,107,53,0.3);
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .tagline {
    text-align: center;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .tagline p {
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .tagline strong {
    color: var(--accent2);
    font-weight: 500;
  }

  .google-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    color: #1a1a1a;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeUp 0.8s 0.4s ease both;
    box-shadow: 0 4px 24px rgba(255,107,53,0.2);
  }

  .google-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,107,53,0.35);
  }

  .google-btn img { width: 20px; height: 20px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── CHAT SCREEN ── */
  #chat-screen {
    flex: 1;
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-logo {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
  }

  .room-name {
    font-size: 13px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    object-fit: cover;
  }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-wrap {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: msgIn 0.2s ease both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.theirs { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    padding: 0 4px;
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }

  .mine .msg-bubble {
    background: var(--my-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .theirs .msg-bubble {
    background: var(--other-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
    padding: 0 4px;
  }

  /* System message */
  .sys-msg {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 12px;
    background: var(--surface2);
    border-radius: 20px;
    align-self: center;
  }

  /* Input Area */
  .chat-input-wrap {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 42px;
    height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    color: #fff;
    font-size: 18px;
  }

  .send-btn:hover { background: #ff8555; transform: scale(1.05); }
  .send-btn:active { transform: scale(0.95); }

  /* Loading */
  #loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 0.8s ease infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-8px); opacity: 1; }
  }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loading" style="display: none;">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<!-- 로그인 화면 -->
<div id="login-screen" style="display: flex;">
  <div class="logo-wrap">
    <div class="logo-emoji">🥟</div>
    <div class="logo-title">MANDU</div>
    <div class="logo-sub">Translation Messenger</div>
  </div>

  <div class="tagline">
    <p>언어가 달라도 <strong>대화는 하나로</strong></p>
    <p>Google 계정으로 바로 시작하세요</p>
  </div>

  <button class="google-btn" onclick="loginGoogle()">
    <img src="./MANDU 🥟_files/google.svg" alt="Google">
    Google로 시작하기
  </button>
</div>

<!-- 채팅 화면 -->
<div id="chat-screen" style="display: none;">
  <div class="chat-header">
    <div class="header-left">
      <span class="header-logo">🥟 MANDU</span>
      <span class="room-name">글로벌 채팅</span>
    </div>
    <div class="header-right">
      <img class="user-avatar" id="user-avatar" src="file:///C:/Users/user/Downloads/mandu_v1_2.html" alt="">
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div id="messages"></div>

  <div class="chat-input-wrap">
    <textarea id="msg-input" placeholder="메시지를 입력하세요..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ── Firebase 설정 ──
const firebaseConfig = {
  apiKey: "AIzaSyAZoWSGSA81daZydNgzegct2aaeFbDajr0",
  authDomain: "mandu-e7c3c.firebaseapp.com",
  projectId: "mandu-e7c3c",
  storageBucket: "mandu-e7c3c.firebasestorage.app",
  messagingSenderId: "196338490174",
  appId: "1:196338490174:web:78dc77e684945aca362a6f",
  measurementId: "G-WEX7HVQ9KX"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let unsubscribe = null;

// ── 인증 상태 감지 ──
auth.onAuthStateChanged(user => {
  document.getElementById('loading').style.display = 'none';

  if (user) {
    currentUser = user;
    showChat(user);
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('chat-screen').style.display = 'none';
  }
});

// ── Google 로그인 ──
async function loginGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    alert('로그인 실패: ' + e.message);
  }
}

// ── 로그아웃 ──
async function logout() {
  if (unsubscribe) unsubscribe();
  await auth.signOut();
}

// ── 채팅 화면 표시 ──
function showChat(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';

  const avatar = document.getElementById('user-avatar');
  avatar.src = user.photoURL || 'https://via.placeholder.com/34';

  loadMessages();
}

// ── 메시지 실시간 로드 ──
function loadMessages() {
  const container = document.getElementById('messages');

  unsubscribe = db.collection('messages')
    .orderBy('createdAt', 'asc')
    .limitToLast(50)
    .onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') {
          renderMessage(change.doc.data());
        }
      });
      scrollToBottom();
    });
}

// ── 메시지 렌더링 ──
function renderMessage(data) {
  const container = document.getElementById('messages');
  const isMine = data.uid === currentUser.uid;

  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isMine ? 'mine' : 'theirs'}`;

  if (!isMine) {
    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.textContent = data.displayName || '익명';
    wrap.appendChild(sender);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = data.text;
  wrap.appendChild(bubble);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = formatTime(data.createdAt);
  wrap.appendChild(time);

  container.appendChild(wrap);
}

// ── 메시지 전송 ──
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentUser) return;

  input.value = '';
  input.style.height = 'auto';

  try {
    await db.collection('messages').add({
      text,
      uid: currentUser.uid,
      displayName: currentUser.displayName,
      photoURL: currentUser.photoURL,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    alert('전송 실패: ' + e.message);
  }
}

// ── 유틸 ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  container.scrollTop = container.scrollHeight;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date();
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
</script>


</body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANDU</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--accent:#ff6b35;--accent2:#ffd166;--text:#f0f0f0;--dim:#7a7a8c;--border:#2a2a3a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
#loading{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:bounce .8s ease infinite;}
.dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-8px);opacity:1;}}
#login-screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px;background:radial-gradient(ellipse at 50% 30%,#1a1a2e,var(--bg));}
.logo-emoji{font-size:72px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.logo-title{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;letter-spacing:6px;color:var(--accent);}
.logo-sub{font-size:12px;color:var(--dim);letter-spacing:3px;}
.tagline{text-align:center;color:var(--dim);font-size:14px;line-height:1.8;}
.tagline strong{color:var(--accent2);}
.google-btn{display:flex;align-items:center;gap:12px;background:#fff;color:#333;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.25);transition:all .2s;}
.google-btn:hover{transform:translateY(-2px);}
.google-btn img{width:20px;height:20px;}
.header{display:flex;align-items:center;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;}
.header-logo{font-family:'Space Mono',monospace;font-size:18px;color:var(--accent);letter-spacing:2px;}
.header-title{font-size:16px;font-weight:500;flex:1;}
.back-btn{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px;flex-shrink:0;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.user-avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;flex-shrink:0;}
.logout-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* 메인 화면 */
#main-screen{flex:1;display:none;flex-direction:column;min-height:0;}
.scroll-area{flex:1;overflow-y:auto;}
.scroll-area::-webkit-scrollbar{width:4px;}
.scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
/* 채팅방 목록 */
.room-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.room-item:hover{background:var(--surface2);}
.room-icon{width:48px;height:48px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.room-icon img{width:100%;height:100%;object-fit:cover;}
.room-info{flex:1;min-width:0;}
.room-name{font-size:15px;font-weight:500;}
.room-last{font-size:13px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.room-time{font-size:11px;color:var(--dim);flex-shrink:0;}
/* 사용자 목록 */
.user-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.user-item:hover,.user-item.selected{background:var(--surface2);}
.user-item.selected .user-item-name::after{content:' ✓';color:var(--accent);}
.user-avatar-md{width:48px;height:48px;border-radius:50%;border:2px solid var(--border);object-fit:cover;flex-shrink:0;}
.user-info{flex:1;}
.user-item-name{font-size:15px;font-weight:500;}
.user-item-email{font-size:13px;color:var(--dim);margin-top:2px;}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,53,.4);display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:100;}
.fab:hover{transform:scale(1.08);}
.empty-state{padding:60px 24px;text-align:center;color:var(--dim);}
.empty-emoji{font-size:48px;margin-bottom:12px;}
/* 채팅 화면 */
#chat-screen{flex:1;display:none;flex-direction:column;min-height:0;}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;}
#messages::-webkit-scrollbar{width:4px;}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg-wrap{display:flex;flex-direction:column;max-width:75%;animation:msgIn .2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg-wrap.mine{align-self:flex-end;align-items:flex-end;}
.msg-wrap.theirs{align-self:flex-start;align-items:flex-start;}
.msg-sender{font-size:11px;color:var(--dim);margin-bottom:3px;padding:0 4px;}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;}
.mine .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.theirs .msg-bubble{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg-time{font-size:10px;color:var(--dim);margin-top:3px;padding:0 4px;}
.chat-input-wrap{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}
#msg-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.5;transition:border-color .2s;}
#msg-input:focus{border-color:var(--accent);}
#msg-input::placeholder{color:var(--dim);}
.send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:12px;cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.send-btn:hover{background:#ff8555;}
/* 그룹 만들기 */
#create-screen{flex:1;display:none;flex-direction:column;min-height:0;}
.create-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:15px;font-family:'Noto Sans KR',sans-serif;outline:none;margin:16px 0 8px;}
.create-input:focus{border-color:var(--accent);}
.create-input::placeholder{color:var(--dim);}
.section-label{font-size:12px;color:var(--dim);padding:12px 16px 4px;letter-spacing:1px;}
.create-done-btn{margin:16px;padding:14px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;width:calc(100% - 32px);}
</style>
</head>
<body>

<div id="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<!-- 로그인 -->
<div id="login-screen">
  <div class="logo-emoji">🥟</div>
  <div class="logo-title">MANDU</div>
  <div class="logo-sub">TRANSLATION MESSENGER</div>
  <div class="tagline"><p>언어가 달라도 <strong>대화는 하나로</strong></p></div>
  <button class="google-btn" id="loginBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
    Google로 시작하기
  </button>
</div>

<!-- 메인 (채팅목록 + 친구목록) -->
<div id="main-screen">
  <div class="header">
    <span class="header-logo">🥟</span>
    <span class="header-title">MANDU</span>
    <div class="header-right">
      <img class="user-avatar" id="my-avatar" src="" alt="">
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-rooms" onclick="switchTab('rooms')">💬 채팅</div>
    <div class="tab" id="tab-friends" onclick="switchTab('friends')">👥 친구</div>
  </div>
  <div class="scroll-area" id="rooms-panel">
    <div id="room-list"></div>
  </div>
  <div class="scroll-area" id="friends-panel" style="display:none;">
    <div id="user-list"></div>
  </div>
  <button class="fab" id="fab-btn" onclick="showCreate()">+</button>
</div>

<!-- 그룹 만들기 -->
<div id="create-screen">
  <div class="header">
    <button class="back-btn" onclick="showMain()">←</button>
    <span class="header-title">새 채팅방 만들기</span>
  </div>
  <div style="padding:0 16px;">
    <input class="create-input" id="group-name" placeholder="채팅방 이름 (단톡방일 때)">
  </div>
  <div class="section-label">대화 상대 선택</div>
  <div class="scroll-area" id="select-user-list"></div>
  <button class="create-done-btn" onclick="createRoom()">채팅방 만들기</button>
</div>

<!-- 채팅 -->
<div id="chat-screen">
  <div class="header">
    <button class="back-btn" onclick="showMain()">←</button>
    <div class="room-icon" id="chat-icon" style="width:32px;height:32px;font-size:16px;margin-right:4px;"></div>
    <span class="header-title" id="chat-title"></span>
  </div>
  <div id="messages"></div>
  <div class="chat-input-wrap">
    <textarea id="msg-input" placeholder="메시지를 입력하세요..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAZoWSGSA81daZydNgzegct2aaeFbDajr0",
  authDomain:"mandu-e7c3c.firebaseapp.com",
  projectId:"mandu-e7c3c",
  storageBucket:"mandu-e7c3c.firebasestorage.app",
  messagingSenderId:"196338490174",
  appId:"1:196338490174:web:78dc77e684945aca362a6f"
});
const auth=firebase.auth();
const db=firebase.firestore();
const provider=new firebase.auth.GoogleAuthProvider();
let currentUser=null, currentRoomId=null, unsubscribeMsg=null;
let selectedUsers=[], allUsers=[];

document.getElementById('loginBtn').onclick=()=>auth.signInWithPopup(provider);
document.getElementById('logoutBtn').onclick=()=>auth.signOut();

auth.onAuthStateChanged(async user=>{
  document.getElementById('loading').style.display='none';
  if(user){
    currentUser=user;
    await db.collection('users').doc(user.uid).set({
      uid:user.uid,displayName:user.displayName,
      photoURL:user.photoURL,email:user.email,
      lastSeen:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    document.getElementById('my-avatar').src=user.photoURL||'';
    showMain();
  } else {
    currentUser=null;
    show('login-screen');
  }
});

function show(id){
  ['login-screen','main-screen','chat-screen','create-screen'].forEach(s=>{
    const el=document.getElementById(s);
    el.style.display='none';
  });
  const el=document.getElementById(id);
  el.style.display='flex';
  el.style.flexDirection='column';
}

function showMain(){
  if(unsubscribeMsg){unsubscribeMsg();unsubscribeMsg=null;}
  show('main-screen');
  loadRooms();
  loadUsers();
}

function switchTab(tab){
  document.getElementById('tab-rooms').classList.toggle('active',tab==='rooms');
  document.getElementById('tab-friends').classList.toggle('active',tab==='friends');
  document.getElementById('rooms-panel').style.display=tab==='rooms'?'block':'none';
  document.getElementById('friends-panel').style.display=tab==='friends'?'block':'none';
}

// 채팅방 목록
function loadRooms(){
  const list=document.getElementById('room-list');
  db.collection('rooms')
    .where('members','array-contains',currentUser.uid)
    .orderBy('lastMessageTime','desc')
    .onSnapshot(snap=>{
      list.innerHTML='';
      if(snap.empty){
        list.innerHTML=`<div class="empty-state"><div class="empty-emoji">🥟</div><p>아직 채팅방이 없어요</p><p style="font-size:12px;margin-top:4px;">+ 버튼으로 채팅방을 만들어보세요!</p></div>`;
        return;
      }
      snap.forEach(doc=>{
        const r=doc.data();
        const item=document.createElement('div');
        item.className='room-item';
        const isGroup=r.type==='group';
        const icon=isGroup?'👥':(r.memberPhotos&&r.memberPhotos[currentUser.uid]?'':'👤');
        const name=isGroup?r.name:(r.memberNames&&Object.entries(r.memberNames).find(([k])=>k!==currentUser.uid)?.[1]||'채팅방');
        const photo=!isGroup&&r.memberPhotos?Object.entries(r.memberPhotos).find(([k])=>k!==currentUser.uid)?.[1]:'';
        item.innerHTML=`
          <div class="room-icon">${photo?`<img src="${photo}" alt="">`:(isGroup?'👥':'👤')}</div>
          <div class="room-info">
            <div class="room-name">${name}</div>
            <div class="room-last">${r.lastMessage||'대화를 시작해보세요'}</div>
          </div>
          <div class="room-time">${formatTime(r.lastMessageTime)}</div>`;
        item.onclick=()=>openRoom(doc.id,name,photo,isGroup);
        list.appendChild(item);
      });
    },()=>{
      // index 없을 때 단순 쿼리로 폴백
      db.collection('rooms').where('members','array-contains',currentUser.uid)
        .onSnapshot(snap=>{
          list.innerHTML='';
          if(snap.empty){list.innerHTML=`<div class="empty-state"><div class="empty-emoji">🥟</div><p>+ 버튼으로 채팅방을 만들어보세요!</p></div>`;return;}
          snap.forEach(doc=>{
            const r=doc.data();
            const item=document.createElement('div');
            item.className='room-item';
            const isGroup=r.type==='group';
            const name=isGroup?r.name:(r.memberNames&&Object.entries(r.memberNames).find(([k])=>k!==currentUser.uid)?.[1]||'채팅방');
            const photo=!isGroup&&r.memberPhotos?Object.entries(r.memberPhotos).find(([k])=>k!==currentUser.uid)?.[1]:'';
            item.innerHTML=`
              <div class="room-icon">${photo?`<img src="${photo}" alt="">`:(isGroup?'👥':'👤')}</div>
              <div class="room-info">
                <div class="room-name">${name}</div>
                <div class="room-last">${r.lastMessage||'대화를 시작해보세요'}</div>
              </div>`;
            item.onclick=()=>openRoom(doc.id,name,photo,isGroup);
            list.appendChild(item);
          });
        });
    });
}

// 친구 목록
function loadUsers(){
  const list=document.getElementById('user-list');
  db.collection('users').onSnapshot(snap=>{
    allUsers=snap.docs.filter(d=>d.id!==currentUser.uid).map(d=>d.data());
    list.innerHTML='';
    if(allUsers.length===0){
      list.innerHTML=`<div class="empty-state"><div class="empty-emoji">🥟</div><p>친구에게 링크를 공유해보세요!</p></div>`;
      return;
    }
    allUsers.forEach(u=>{
      const item=document.createElement('div');
      item.className='user-item';
      item.innerHTML=`
        <img class="user-avatar-md" src="${u.photoURL||''}" onerror="this.style.display='none'" alt="">
        <div class="user-info">
          <div class="user-item-name">${u.displayName||'익명'}</div>
          <div class="user-item-email">${u.email||''}</div>
        </div>`;
      item.onclick=()=>startDM(u);
      list.appendChild(item);
    });
  });
}

// 1:1 채팅 시작
async function startDM(partner){
  const ids=[currentUser.uid,partner.uid].sort();
  const roomId=ids.join('_');
  await db.collection('rooms').doc(roomId).set({
    type:'direct',
    members:ids,
    memberNames:{[currentUser.uid]:currentUser.displayName,[partner.uid]:partner.displayName},
    memberPhotos:{[currentUser.uid]:currentUser.photoURL||'',[partner.uid]:partner.photoURL||''},
    lastMessage:'',
    lastMessageTime:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
  openRoom(roomId,partner.displayName,partner.photoURL,false);
}

// 그룹 만들기 화면
function showCreate(){
  selectedUsers=[];
  show('create-screen');
  const list=document.getElementById('select-user-list');
  list.innerHTML='';
  allUsers.forEach(u=>{
    const item=document.createElement('div');
    item.className='user-item';
    item.id='sel_'+u.uid;
    item.innerHTML=`
      <img class="user-avatar-md" src="${u.photoURL||''}" onerror="this.style.display='none'" alt="">
      <div class="user-info">
        <div class="user-item-name">${u.displayName||'익명'}</div>
      </div>`;
    item.onclick=()=>{
      const idx=selectedUsers.findIndex(x=>x.uid===u.uid);
      if(idx>=0){selectedUsers.splice(idx,1);item.classList.remove('selected');}
      else{selectedUsers.push(u);item.classList.add('selected');}
    };
    list.appendChild(item);
  });
}

// 채팅방 만들기
async function createRoom(){
  if(selectedUsers.length===0){alert('대화 상대를 선택하세요!');return;}
  if(selectedUsers.length===1){
    await startDM(selectedUsers[0]);return;
  }
  // 그룹
  const name=document.getElementById('group-name').value.trim()||'그룹 채팅';
  const members=[currentUser.uid,...selectedUsers.map(u=>u.uid)];
  const memberNames={[currentUser.uid]:currentUser.displayName};
  const memberPhotos={[currentUser.uid]:currentUser.photoURL||''};
  selectedUsers.forEach(u=>{memberNames[u.uid]=u.displayName;memberPhotos[u.uid]=u.photoURL||'';});
  const ref=await db.collection('rooms').add({
    type:'group',name,members,memberNames,memberPhotos,
    lastMessage:'',
    lastMessageTime:firebase.firestore.FieldValue.serverTimestamp()
  });
  openRoom(ref.id,name,'',true);
}

// 채팅방 열기
function openRoom(roomId,name,photo,isGroup){
  currentRoomId=roomId;
  document.getElementById('chat-title').textContent=name;
  const icon=document.getElementById('chat-icon');
  icon.innerHTML=photo?`<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`:(isGroup?'👥':'👤');
  show('chat-screen');
  loadMessages();
}

function loadMessages(){
  const container=document.getElementById('messages');
  container.innerHTML='';
  if(unsubscribeMsg)unsubscribeMsg();
  unsubscribeMsg=db.collection('rooms').doc(currentRoomId)
    .collection('messages').orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{if(ch.type==='added')renderMsg(ch.doc.data());});
      container.scrollTop=container.scrollHeight;
    });
}

function renderMsg(d){
  const container=document.getElementById('messages');
  const mine=d.uid===currentUser.uid;
  const w=document.createElement('div');
  w.className='msg-wrap '+(mine?'mine':'theirs');
  if(!mine){const s=document.createElement('div');s.className='msg-sender';s.textContent=d.displayName||'익명';w.appendChild(s);}
  const b=document.createElement('div');b.className='msg-bubble';b.textContent=d.text;w.appendChild(b);
  const t=document.createElement('div');t.className='msg-time';
  t.textContent=d.createdAt?d.createdAt.toDate().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  w.appendChild(t);container.appendChild(w);
}

async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text||!currentUser||!currentRoomId)return;
  input.value='';input.style.height='auto';
  await db.collection('rooms').doc(currentRoomId).collection('messages').add({
    text,uid:currentUser.uid,displayName:currentUser.displayName,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection('rooms').doc(currentRoomId).set({
    lastMessage:text,lastMessageTime:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function formatTime(ts){if(!ts)return '';const d=ts.toDate?ts.toDate():new Date();return d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANDU Class</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111418">
<link rel="icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#111418;--panel:#1b1f25;--ink:#f3f5f7;--sub:#9aa3ae;--line:#2a3038;--brand:#2fbf7f;--live:#ff4d45;--fs:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:14px;line-height:1.5}
/* 언어 선택 */
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.langs button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;font-size:18px;text-align:left;display:flex;gap:10px;align-items:center}
.langs button.sel{border-color:var(--brand);background:#17352a}
.langs .fl{font-size:24px}
/* 코드 입력 */
.codein{font-size:32px;letter-spacing:8px;text-align:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;margin:16px 0 10px}
.btn{background:var(--brand);color:#05140d;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;width:100%}
/* 자막 화면 */
.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .st{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .st.live{color:var(--live)}
.bar button{background:#262b33;border:0;border-radius:10px;padding:8px 10px;font-size:14px}
.bar button.on{background:#17352a;color:var(--brand)}
#subs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 120px}
.seg{padding:12px 0;border-bottom:1px solid var(--line)}
.seg .tr{font-size:var(--fs);line-height:1.45;font-weight:600;overflow-wrap:anywhere}
.seg .tr.koonly{font-weight:500;color:#d7dce2}
.seg .ko{font-size:calc(var(--fs) * .58);color:var(--sub);margin-top:4px;line-height:1.45}
.seg .note{font-size:12px;color:var(--sub);margin-left:6px;font-weight:400}
body.noko .seg .ko{display:none}
#live{font-size:calc(var(--fs) * .7);color:var(--sub);opacity:.75;padding:12px 0;font-style:italic;min-height:1em}
#empty{color:var(--sub);text-align:center;margin-top:30vh;font-size:18px;line-height:1.6}
#toLatest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--brand);color:#05140d;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#endBanner{background:#262b33;padding:14px 16px;text-align:center;font-weight:700;font-size:16px}
</style>
</head>
<body>

<!-- 코드 입력 (QR 없이 들어온 경우) -->
<div id="vCode" class="screen pad hidden">
  <h2>🥟 MANDU Class</h2>
  <div class="sub">Enter the 6-digit class code · 수업 코드 6자리</div>
  <input id="codeIn" class="codein" inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="off">
  <button class="btn" id="btnJoin">Join</button>
  <div class="sub" id="codeErr" style="margin-top:12px;color:var(--live)"></div>
</div>

<!-- 언어 선택 -->
<div id="vLang" class="screen pad hidden">
  <h2>🥟 Choose your language</h2>
  <div class="sub">언어를 선택하세요 · 选择语言 · Chọn ngôn ngữ</div>
  <div class="langs" id="langs"></div>
</div>

<!-- 자막 -->
<div id="vSubs" class="screen hidden" style="height:100dvh">
  <div class="bar">
    <div class="st" id="status">…</div>
    <button id="btnKo" title="Korean">한국어</button>
    <button id="btnSize" title="Text size">A<small>A</small></button>
    <button id="btnLang"></button>
  </div>
  <div id="endBanner" class="hidden"></div>
  <div id="subs">
    <div id="empty"></div>
    <div id="list"></div>
    <div id="live"></div>
  </div>
  <button id="toLatest" class="hidden"></button>
</div>

<script>
const LANGS = [
  ['en','🇺🇸','English'],['zh','🇨🇳','中文'],['vi','🇻🇳','Tiếng Việt'],['ja','🇯🇵','日本語'],
  ['mn','🇲🇳','Монгол'],['id','🇮🇩','Bahasa Indonesia'],['th','🇹🇭','ภาษาไทย'],['hi','🇮🇳','हिन्दी'],
  ['ar','🇸🇦','العربية'],['es','🇪🇸','Español'],['fr','🇫🇷','Français'],['de','🇩🇪','Deutsch'],
  ['pt','🇧🇷','Português'],['it','🇮🇹','Italiano'],['da','🇩🇰','Dansk']
];
// 화면 문구 (짧게) — 없는 언어는 영어
const T = {
  en:{wait:'Waiting for the class to start',pause:'Paused',end:'The class has ended',latest:'Latest',nf:'Class not found. Check the code.',notr:'(not translated)'},
  ja:{wait:'授業の開始を待っています',pause:'一時停止中',end:'授業が終了しました',latest:'最新へ',nf:'授業が見つかりません。コードを確認してください。',notr:'(未翻訳)'},
  zh:{wait:'等待上课开始',pause:'已暂停',end:'课程已结束',latest:'最新',nf:'找不到课程，请检查代码。',notr:'(未翻译)'},
  vi:{wait:'Đang chờ lớp học bắt đầu',pause:'Tạm dừng',end:'Lớp học đã kết thúc',latest:'Mới nhất',nf:'Không tìm thấy lớp học. Hãy kiểm tra mã.',notr:'(chưa dịch)'},
  es:{wait:'Esperando a que empiece la clase',pause:'En pausa',end:'La clase ha terminado',latest:'Lo último',nf:'No se encontró la clase. Revisa el código.',notr:'(sin traducir)'},
  fr:{wait:'En attente du début du cours',pause:'En pause',end:'Le cours est terminé',latest:'Plus récent',nf:'Cours introuvable. Vérifiez le code.',notr:'(non traduit)'},
  de:{wait:'Warten auf den Beginn der Vorlesung',pause:'Pausiert',end:'Die Vorlesung ist beendet',latest:'Neueste',nf:'Vorlesung nicht gefunden. Bitte Code prüfen.',notr:'(nicht übersetzt)'},
  th:{wait:'กำลังรอให้ชั้นเรียนเริ่ม',pause:'หยุดชั่วคราว',end:'ชั้นเรียนจบแล้ว',latest:'ล่าสุด',nf:'ไม่พบชั้นเรียน กรุณาตรวจสอบรหัส',notr:'(ยังไม่แปล)'},
  mn:{wait:'Хичээл эхлэхийг хүлээж байна',pause:'Түр зогссон',end:'Хичээл дууслаа',latest:'Хамгийн сүүлийн',nf:'Хичээл олдсонгүй. Кодоо шалгана уу.',notr:'(орчуулаагүй)'},
  hi:{wait:'कक्षा शुरू होने की प्रतीक्षा है',pause:'रुका हुआ',end:'कक्षा समाप्त हो गई है',latest:'नवीनतम',nf:'कक्षा नहीं मिली। कोड जाँचें।',notr:'(अनुवाद नहीं)'},
  pt:{wait:'Aguardando o início da aula',pause:'Em pausa',end:'A aula terminou',latest:'Mais recente',nf:'Aula não encontrada. Verifique o código.',notr:'(sem tradução)'},
  ar:{wait:'في انتظار بدء المحاضرة',pause:'متوقف مؤقتًا',end:'انتهت المحاضرة',latest:'الأحدث',nf:'لم يتم العثور على المحاضرة. تحقق من الرمز.',notr:'(غير مترجم)'},
  id:{wait:'Menunggu kelas dimulai',pause:'Dijeda',end:'Kelas telah selesai',latest:'Terbaru',nf:'Kelas tidak ditemukan. Periksa kodenya.',notr:'(belum diterjemahkan)'},
  it:{wait:'In attesa che inizi la lezione',pause:'In pausa',end:'La lezione è terminata',latest:'Più recenti',nf:'Lezione non trovata. Controlla il codice.',notr:'(non tradotto)'},
  da:{wait:'Venter på at undervisningen starter',pause:'På pause',end:'Undervisningen er slut',latest:'Nyeste',nf:'Undervisningen blev ikke fundet. Tjek koden.',notr:'(ikke oversat)'}
};
const tt = k => (T[lang] || T.en)[k] || T.en[k];

// 메신저(index.html)와 로그인 상태가 섞이지 않도록 이름 붙은 별도 앱으로 초기화 — 학생 익명 로그인이 메신저에 영향을 주지 않는다
const app = firebase.initializeApp({
  apiKey:"AIzaSyAmebb0FQ4MxywQlMGgm8zrL2Ta97eskbo",
  authDomain:"mandutok.firebaseapp.com",
  projectId:"mandutok",
  storageBucket:"mandutok.firebasestorage.app",
  messagingSenderId:"1035686595939",
  appId:"1:1035686595939:web:bea62dd7797325cff41756"
}, 'mandu-class');
const auth = app.auth();
const db = app.firestore();
const FV = firebase.firestore.FieldValue;

const $ = id => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
function view(v) { ['vCode','vLang','vSubs'].forEach(x => show(x, x === v)); }

let code = (new URLSearchParams(location.search).get('room') || '').replace(/\D/g, '');
let lang = store.get('mandu_class_lang');
if (!LANGS.some(l => l[0] === lang)) lang = null;
let uid = null, classRef = null, status = '', started = false;

// ── 시작 ────────────────────────────────────────────
auth.onAuthStateChanged(u => {
  if (!u) { auth.signInAnonymously().catch(e => { $('codeErr').textContent = 'Login failed: ' + (e.code || e.message); view('vCode'); }); return; }
  uid = u.uid;
  if (started) return;
  started = true;
  if (/^\d{6}$/.test(code)) enter(); else view('vCode');
});
$('btnJoin').onclick = () => {
  const c = $('codeIn').value.replace(/\D/g, '');
  if (!/^\d{6}$/.test(c)) return;
  code = c;
  history.replaceState(null, '', '?room=' + c);
  enter();
};
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnJoin').click(); });

async function enter() {
  classRef = db.collection('classes').doc(code);
  let snap;
  try { snap = await classRef.get(); } catch (e) { snap = null; }
  if (!snap || !snap.exists) { view('vCode'); $('codeIn').value = code; $('codeErr').textContent = tt('nf'); return; }
  if (lang) openSubs(); else pickLang();
}

// ── 언어 선택 ──────────────────────────────────────────
function pickLang() {
  const box = $('langs');
  box.innerHTML = '';
  LANGS.forEach(([c, f, n]) => {
    const b = document.createElement('button');
    b.innerHTML = `<span class="fl">${f}</span><span></span>`;
    b.lastChild.textContent = n;
    if (c === lang) b.className = 'sel';
    b.onclick = () => {
      const old = lang;
      lang = c; store.set('mandu_class_lang', c);
      if (old && old !== c) leave(old);
      openSubs();
    };
    box.appendChild(b);
  });
  view('vLang');
}
$('btnLang').onclick = pickLang;

// ── 접속 표시 (언어 등록) — 학생 수가 아니라 언어 수만큼만 번역하기 위함 ──
function beat() {
  if (!lang || !classRef || status === 'ended') return;
  classRef.collection('languages').doc(lang).set({u: {[uid]: FV.serverTimestamp()}}, {merge: true}).catch(() => {});
}
function leave(l) {
  if (!classRef || !l) return;
  classRef.collection('languages').doc(l).update({['u.' + uid]: FV.delete()}).catch(() => {});
}
setInterval(beat, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') beat(); });
window.addEventListener('pagehide', e => { if (!e.persisted) leave(lang); });

// ── 자막 화면 ──────────────────────────────────────────
let subsOn = false, segs = new Map();
function openSubs() {
  view('vSubs');
  document.documentElement.lang = lang;
  const L = LANGS.find(l => l[0] === lang);
  $('btnLang').textContent = L[1] + ' ' + L[0].toUpperCase();
  $('toLatest').textContent = '↓ ' + tt('latest');
  beat();
  // 이미 받은 자막은 새 언어로 다시 그린다
  segs.forEach((d, id) => paintSeg(id, d));
  renderStatus();
  if (subsOn) return;
  subsOn = true;
  classRef.onSnapshot(s => { status = (s.data() || {}).status || ''; renderStatus(); });
  classRef.collection('live').doc('now').onSnapshot(s => { setLive((s.data() || {}).text || ''); }, () => {});
  classRef.collection('segments').orderBy('t').onSnapshot(snap => {
    const stick = atBottom();
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === 'removed') { const el = document.getElementById('s' + id); el && el.remove(); segs.delete(id); return; }
      segs.set(id, ch.doc.data());
      paintSeg(id, ch.doc.data(), ch.newIndex);
      if (ch.type === 'added') lastLiveShown = '';   // 확정 자막이 오면 '말하는 중' 줄을 지운다
    });
    setLive(liveText);
    $('empty').classList.toggle('hidden', segs.size > 0);
    afterContent(stick);
  }, e => console.warn(e));
}

function paintSeg(id, d, idx) {
  let el = document.getElementById('s' + id);
  const list = $('list');
  if (!el) {
    el = document.createElement('div');
    el.className = 'seg'; el.id = 's' + id;
    el.innerHTML = '<div class="tr" dir="auto"></div><div class="ko" lang="ko"></div>';
    const ref = (typeof idx === 'number') ? list.children[idx] : null;
    list.insertBefore(el, ref || null);
  }
  const tr = (d.tr || {})[lang];
  const main = el.firstChild, ko = el.lastChild;
  main.textContent = tr || d.ko || '';
  main.classList.toggle('koonly', !tr);
  if (!tr) {
    const n = document.createElement('span'); n.className = 'note'; n.textContent = tt('notr');
    main.appendChild(n);
  }
  ko.textContent = tr ? (d.ko || '') : '';
}

let liveText = '', lastLiveShown = '';
function setLive(t) {
  liveText = t;
  if (t) lastLiveShown = t;
  const stick = atBottom();
  // 교수님이 문장을 끝내면 live가 비지만, 번역된 자막이 도착할 때까지 마지막 말을 흐리게 남겨 둔다
  const showT = status === 'live' ? (t || lastLiveShown) : '';
  $('live').textContent = showT ? '🎤 ' + showT : '';
  afterContent(stick);
}

function renderStatus() {
  const st = $('status');
  st.className = 'st' + (status === 'live' ? ' live' : '');
  st.textContent = status === 'live' ? '🔴 LIVE' : status === 'paused' ? '⏸ ' + tt('pause') : status === 'ended' ? '■ ' + tt('end') : '… ' + tt('wait');
  $('empty').textContent = tt('wait');
  show('endBanner', status === 'ended');
  $('endBanner').textContent = tt('end');
  if (status !== 'live') setLiveHidden();
  if (status === 'ended') leave(lang);
}
function setLiveHidden() { $('live').textContent = ''; }

// ── 자동 스크롤 (위로 올려 읽는 중이면 멈춤 + '최신으로' 버튼) ──
const subs = $('subs');
function atBottom() { return subs.scrollHeight - subs.scrollTop - subs.clientHeight < 80; }
function afterContent(stick) {
  if (stick) { subs.scrollTop = subs.scrollHeight; show('toLatest', false); }
  else if (segs.size) show('toLatest', true);
}
subs.addEventListener('scroll', () => { if (atBottom()) show('toLatest', false); }, {passive: true});
$('toLatest').onclick = () => { subs.scrollTo({top: subs.scrollHeight, behavior: 'smooth'}); show('toLatest', false); };

// ── 한국어 원문 켜기/끄기 · 글자 크기 ─────────────────────────
let koOn = store.get('mandu_class_ko') !== '0';
function applyKo() { document.body.classList.toggle('noko', !koOn); $('btnKo').classList.toggle('on', koOn); }
$('btnKo').onclick = () => { koOn = !koOn; store.set('mandu_class_ko', koOn ? '1' : '0'); applyKo(); };
applyKo();
const SIZES = [20, 26, 34];
let size = parseInt(store.get('mandu_class_size') || '1', 10);
if (!(size >= 0 && size <= 2)) size = 1;
function applySize() { document.documentElement.style.setProperty('--fs', SIZES[size] + 'px'); }
$('btnSize').onclick = () => { const stick = atBottom(); size = (size + 1) % 3; store.set('mandu_class_size', String(size)); applySize(); afterContent(stick); };
applySize();
</script>
</body>
</html>
